name: AMP CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  typescript-build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    - run: npm ci
    - name: Lint TypeScript
      run: npm run lint
    - run: npm run build
    - name: Run TS Tests
      run: npm run test
      env:
        REDIS_URL: redis://localhost:6379

  python-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pytest pytest-asyncio
        pip install -e python/
    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors and undefined names
        flake8 python/amp --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style checks (line length etc.) — exit-zero for now but show stats
        flake8 python/amp --count --max-complexity=10 --max-line-length=100 --statistics --exit-zero
    - name: Check black formatting
      run: |
        pip install black
        black --check python/amp
      continue-on-error: true  # warn-only for now
    - name: Test Python
      run: |
        cd python && pytest tests/ -v
      env:
        REDIS_URL: redis://localhost:6379
